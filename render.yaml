services:
  - type: web
    name: habitbloom
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false        # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure random value
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        sync: false        # Set to your Render app URL after deploy
